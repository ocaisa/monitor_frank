<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Node Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131a2e;
      --panel-2: #0f1526;
      --border: #223052;
      --text: #e6ecff;
      --muted: #8492b6;
      --green: #34d399;
      --amber: #fbbf24;
      --red: #f87171;
      --cyan: #22d3ee;
      --violet: #a78bfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, #16203f 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 28px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: rgba(11,16,32,.82); backdrop-filter: blur(8px); z-index: 5;
    }
    header h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .3px; }
    header h1 span { color: var(--green); }
    .meta { display: flex; gap: 18px; align-items: center; color: var(--muted); font-size: 13px; }
    .meta b { color: var(--text); font-weight: 600; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-box { display: inline-flex; align-items: center; background: #e6eaf2;
                border-radius: 10px; padding: 4px 6px; }
    .logo { height: 28px; width: auto; display: block; }
    .statuslink { color: var(--cyan); text-decoration: none; font-size: 12px; font-weight: 600;
                  border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
    .statuslink:hover { border-color: var(--cyan); background: rgba(34,211,238,.08); }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .grid {
      display: grid; gap: 20px; padding: 24px 28px 40px;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    }
    .card {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border); border-radius: 16px; padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .card.offline { opacity: .75; }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .node-name { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
    .host { color: var(--muted); font-size: 12px; font-weight: 400; font-family: ui-monospace, monospace; }
    .badge { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
             padding: 4px 9px; border-radius: 999px; }
    .badge.on { background: rgba(52,211,153,.15); color: var(--green); }
    .badge.off { background: rgba(248,113,113,.15); color: var(--red); }
    .err { color: var(--red); font-size: 12.5px; margin: 10px 0 0; word-break: break-word;
           font-family: ui-monospace, monospace; }

    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .metric { background: rgba(255,255,255,.02); border: 1px solid var(--border);
              border-radius: 12px; padding: 12px; }
    .metric .label { color: var(--muted); font-size: 11px; text-transform: uppercase;
                     letter-spacing: .6px; margin-bottom: 8px; }
    .gauge-wrap { display: flex; align-items: center; gap: 12px; }
    .gauge {
      --val: 0; --col: var(--green);
      width: 62px; height: 62px; border-radius: 50%; flex: 0 0 auto;
      background: conic-gradient(var(--col) calc(var(--val) * 1%), rgba(255,255,255,.07) 0);
      -webkit-mask: radial-gradient(farthest-side, transparent 62%, #000 63%);
      mask: radial-gradient(farthest-side, transparent 62%, #000 63%);
      position: relative;
    }
    .gauge-val { font-size: 22px; font-weight: 700; line-height: 1; }
    .gauge-val small { font-size: 12px; color: var(--muted); font-weight: 500; }
    .sub { color: var(--muted); font-size: 12px; margin-top: 8px; }

    .bar { height: 8px; background: rgba(255,255,255,.07); border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .bar > i { display: block; height: 100%; border-radius: 999px; transition: width .5s ease; }
    .load { font-size: 13px; margin-top: 6px; color: var(--text); }
    .load span { color: var(--muted); font-size: 11px; }
    .cores-toggle { background: none; border: 1px solid var(--border); color: var(--muted);
                    font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 9px;
                    cursor: pointer; margin-left: 8px; }
    .cores-toggle:hover { color: var(--text); border-color: var(--muted); }
    .cores-toggle.open { color: var(--cyan); border-color: var(--cyan); }
    .coregrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 8px 18px; margin-top: 4px; }
    .core { display: grid; grid-template-columns: 30px 1fr 38px; align-items: center; gap: 8px;
            font-size: 12px; }
    .core .core-id { color: var(--muted); font-family: ui-monospace, monospace; }
    .core .core-val { text-align: right; font-weight: 600; font-family: ui-monospace, monospace; }

    .gpus { margin-bottom: 14px; }
    .gpus .title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }
    .gpu { display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 10px;
           padding: 7px 0; border-bottom: 1px dashed rgba(255,255,255,.06); }
    .gpu:last-child { border-bottom: 0; }
    .gpu .gid { font-family: ui-monospace, monospace; color: var(--muted); font-size: 12px; }
    .gpu .gval { font-weight: 700; font-size: 14px; }
    .gpu .gmem { color: var(--muted); font-size: 11.5px; font-family: ui-monospace, monospace; }
    .nongpu { color: var(--muted); font-size: 12.5px; font-style: italic; }

    .chart-box { height: 130px; position: relative; margin-top: 4px; }
    .placeholder { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .dot.pulse { animation: pulse 1.4s infinite; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo-box"><img class="logo" src="{{ url_for('static', filename='eessi-512px.png') }}" alt="EESSI" /></span>
      <h1>Cluster <span>Monitor</span></h1>
    </div>
    <div class="meta">
      <div>Nodes <b id="m-nodes">0</b></div>
      <div>Online <b id="m-online">0</b></div>
      <div>Refresh <b id="m-interval">–</b></div>
      <div>Last update <b id="m-updated">–</b></div>
      <a class="statuslink" href="https://status.eessi.io/" target="_blank" rel="noopener noreferrer">EESSI status</a>
    </div>
  </header>

  <div class="grid" id="grid">
    <div class="placeholder">Loading…</div>
  </div>

  <script>
    const grid = document.getElementById("grid");
    const charts = {};
    let knownNames = null;

    function colorFor(v) {
      if (v == null) return "var(--muted)";
      if (v >= 85) return "var(--red)";
      if (v >= 60) return "var(--amber)";
      return "var(--green)";
    }
    function timeStr(ts) {
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString([], { hour12: false });
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function makeChart(name) {
      const ctx = document.getElementById("chart-" + name);
      if (!ctx) return;
      charts[name] = new Chart(ctx, {
        type: "line",
        data: { labels: [], datasets: [
          { label: "CPU", data: [], borderColor: "#34d399", backgroundColor: "rgba(52,211,153,.12)",
            fill: true, tension: .35, pointRadius: 0, borderWidth: 2, spanGaps: true, yAxisID: "y" },
          { label: "GPU", data: [], borderColor: "#22d3ee", backgroundColor: "rgba(34,211,238,.10)",
            fill: true, tension: .35, pointRadius: 0, borderWidth: 2, spanGaps: true, yAxisID: "y" },
        ] },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { display: true, labels: { color: "#8492b6", boxWidth: 12, font: { size: 11 } } },
            tooltip: { callbacks: { title: (i) => i[0].label } },
          },
          scales: {
            x: { ticks: { color: "#5b6a92", maxTicksLimit: 6, font: { size: 10 } }, grid: { display: false } },
            y: { min: 0, max: 100, ticks: { color: "#5b6a92", stepSize: 50, font: { size: 10 } },
                 grid: { color: "rgba(255,255,255,.05)" }, title: { display: false } },
          },
        },
      });
    }

    function coreHtml(c) {
  const col = colorFor(c.util);
  return `<div class="core">
    <span class="core-id">C${c.index}</span>
    <div class="bar"><i style="width:${c.util}%;background:${col}"></i></div>
    <span class="core-val" style="color:${col}">${c.util}%</span>
  </div>`;
}

function gpuHtml(g) {
      const col = colorFor(g.util);
      const mem = g.mem_total_mb ? `${g.mem_used_mb} / ${g.mem_total_mb} MB` : "";
      return `<div class="gpu">
        <span class="gid">GPU ${g.index}</span>
        <div class="bar"><i style="width:${g.util}%;background:${col}"></i></div>
        <span class="gval" style="color:${col}">${g.util}%</span>
      </div>` +
      (mem ? `<div class="gmem" style="margin:-2px 0 4px 56px">${mem}</div>` : "");
    }

    function render(node) {
      const online = !!node.online;
      const el = document.getElementById("card-" + node.name);
      const col = colorFor(node.cpu);

      let cpuVal, memVal, loadVal, gpuBlock, chart;

      if (!online) {
        cpuVal = `<div class="gauge" style="--val:0"></div>
                  <div><div class="gauge-val">–</div></div>`;
        memVal = `<div class="load">–</div><div class="bar"><i style="width:0%"></i></div>`;
        loadVal = `<div class="load">–</div>`;
        gpuBlock = `<div class="nongpu">offline</div>`;
        el.classList.add("offline");
        el.innerHTML = head(node, online) +
          `<p class="err">${esc(node.error || "unreachable")}</p>`;
        return;
      }
      el.classList.remove("offline");

      cpuVal = `<div class="gauge" style="--val:${node.cpu};--col:${col}"></div>
                <div><div class="gauge-val">${node.cpu}<small>%</small></div></div>`;

      const memCol = colorFor(node.mem_pct);
      memVal = `<div class="load">${node.mem_pct}% <span>· ${node.mem_used_mb} / ${node.mem_total_mb} MB</span></div>
                <div class="bar"><i style="width:${node.mem_pct}%;background:${memCol}"></i></div>`;

      const loadText = node.load1 != null
        ? `${node.load1.toFixed(2)} / ${node.load5.toFixed(2)} / ${node.load15.toFixed(2)}` : "–";
      loadVal = `<div class="load">${loadText} <span>load 1/5/15 · ${node.cpu_count} cores</span></div>`;

      const cores = node.cores || [];
      const coreBlock = cores.length
        ? `<div class="metric" style="grid-column:1 / -1">
             <div class="label">Per-core CPU
               <button class="cores-toggle" type="button">${cores.length} cores</button>
             </div>
             <div class="coregrid" hidden>${cores.map(coreHtml).join("")}</div>
           </div>`
        : "";

      gpuBlock = node.gpus.length
        ? `<div class="title">GPUs (${node.gpus.length})</div>` + node.gpus.map(gpuHtml).join("")
        : `<div class="title">GPUs</div><div class="nongpu">no GPUs detected</div>`;

      el.innerHTML = head(node, online) +
        `<div class="metrics">
           <div class="metric"><div class="label">CPU</div>
             <div class="gauge-wrap">${cpuVal}</div></div>
           <div class="metric"><div class="label">Memory</div>${memVal}</div>
           <div class="metric" style="grid-column:1 / -1"><div class="label">Load</div>${loadVal}</div>
           ${coreBlock}
         </div>
         <div class="gpus">${gpuBlock}</div>
         <div class="metric"><div class="label">Trend</div>
            <div class="chart-box"><canvas id="chart-${node.name}"></canvas></div>
          </div>`;

      if (openCores.has(node.name)) {
        const panel = el.querySelector(".coregrid");
        const btn = el.querySelector(".cores-toggle");
        if (panel && btn) { panel.hidden = false; btn.classList.add("open"); }
      }
      if (!charts[node.name]) makeChart(node.name);
      updateChart(node);
    }

    function head(node, online) {
      const dot = online ? "var(--green)" : "var(--red)";
      const badge = online
        ? `<span class="badge on">online</span>`
        : `<span class="badge off">offline</span>`;
      return `<div class="card-head">
                <div class="node-name">
                  <span class="dot ${online ? "" : "pulse"}" style="background:${dot}"></span>
                  ${esc(node.name)}
                  <span class="host">${esc(node.host)}</span>
                </div>
                ${badge}
              </div>`;
    }

    function updateChart(node) {
      const c = charts[node.name];
      if (!c) return;
      const h = node.history || [];
      const labels = h.map(p => timeStr(p.ts));
      c.data.labels = labels;
      c.data.datasets[0].data = h.map(p => p.cpu);
      const hasGpu = (node.gpus || []).length > 0;
      c.data.datasets[1].data = h.map(p => (hasGpu ? p.gpu : null));
      c.data.datasets[1].hidden = !hasGpu;
      c.update("none");
    }

    function buildCards(nodes) {
      grid.innerHTML = "";
      Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; });
      nodes.forEach(n => {
        const card = document.createElement("div");
        card.className = "card";
        card.id = "card-" + n.name;
        grid.appendChild(card);
      });
      knownNames = nodes.map(n => n.name).sort().join(",");
    }

    const openCores = new Set();
grid.addEventListener("click", (e) => {
  const btn = e.target.closest(".cores-toggle");
  if (!btn) return;
  const name = btn.closest(".card").id.slice(5);
  const panel = btn.parentElement.nextElementSibling;
  const nowOpen = panel.hidden;
  panel.hidden = !nowOpen;
  btn.classList.toggle("open", nowOpen);
  if (nowOpen) openCores.add(name); else openCores.delete(name);
});

async function refresh() {
      let data;
      try {
        const r = await fetch("/api/status");
        data = await r.json();
      } catch (e) {
        document.getElementById("m-updated").textContent = "error";
        setTimeout(refresh, 5000);
        return;
      }
      const names = data.nodes.map(n => n.name).sort().join(",");
      if (names !== knownNames) buildCards(data.nodes);

      data.nodes.forEach(render);

      const online = data.nodes.filter(n => n.online).length;
      document.getElementById("m-nodes").textContent = data.nodes.length;
      document.getElementById("m-online").textContent = online;
      document.getElementById("m-interval").textContent = data.interval + "s";
      document.getElementById("m-updated").textContent = timeStr(Date.now() / 1000);

      setTimeout(refresh, Math.max(2000, data.interval * 1000));
    }

    refresh();
  </script>
</body>
</html>
